version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: JobSpring
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: JobSpring_DB

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: